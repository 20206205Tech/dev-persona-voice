name: dev-persona-voice

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  deploy-persona-voice:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      # Bước xác định môi trường (dev hoặc prod) dựa trên sự kiện trigger
      - name: Determine Doppler Config
        id: set-env
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "DOPPLER_CONFIG=dev" >> $GITHUB_ENV
          else
            echo "DOPPLER_CONFIG=prod" >> $GITHUB_ENV
          fi

      - name: main
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: doppler run --project 20206205tech --config ${{ env.DOPPLER_CONFIG }} -- uv run python main.py
